# Builds the two per-architecture images addon/config.yaml's `image:` names.
#
# Not home-assistant/builder: that action, like the supervisor itself, builds
# the add-on folder as the docker context, and ClaudeLoop's source is the
# repository root. This does the same job with the context one level up.
name: add-on image

on:
  push:
    tags: ["addon-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The addon/config.yaml version to publish, e.g. 0.1.0
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Read the add-on version and image owner
        id: addon
        # config.yaml's version is the single source of truth: the supervisor
        # pulls image:version, so a tag that disagrees with it installs
        # nothing. The owner is lowercased because a docker repository name
        # must be -- "KamilPostrozny" fails the build outright.
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' addon/config.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          tags: |
            ghcr.io/${{ steps.addon.outputs.owner }}/claudeloop-${{ matrix.arch }}:${{ steps.addon.outputs.version }}
            ghcr.io/${{ steps.addon.outputs.owner }}/claudeloop-${{ matrix.arch }}:latest
